<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruleta de Decisiones</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 420px; margin: 40px auto; padding: 0 20px; text-align: center; }
  textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font: inherit; }
  button { margin-top: 12px; padding: 10px 18px; background: #8e44ad; color: white; border: none; border-radius: 6px; cursor: pointer; }
  #resultado { margin-top: 16px; font-size: 1.4rem; font-weight: bold; color: #8e44ad; min-height: 1.6em; }
</style>
</head>
<body>
  <h1>🎡 Ruleta de Decisiones</h1>
  <p>Una opción por línea:</p>
  <textarea id="opciones" rows="5">Pizza
Sushi
Hamburguesa
Ensalada</textarea>
  <button id="btn-girar">🎲 Girar</button>
  <div id="resultado"></div>
  <script src="script.js"></script>
</body>
</html>
